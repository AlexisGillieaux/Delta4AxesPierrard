; Configuration PlatformIO pour Teensy 4.1
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Vitesse de communication UART avec le Raspberry Pi (Serial1)
monitor_speed = 115200
monitor_dtr = 1
monitor_echo = yes
monitor_filters = send_on_enter

; Les programmes de test ont leur propre environnement (plus bas) : pas compilés ici
build_src_filter = +<*> -<test_*.cpp>

; Exemple de gestion des bibliothèques
; lib_deps =
;     bblanchon/ArduinoJson @ ^7.0.0


; Premier test RS485 (module MAX485, DE/RE sur la broche 2) : lit la température
; de chaque variateur du bus (adresses 1 et 2) une fois par seconde. src/test_rs485_simple.cpp, autonome (n'utilise pas lib/A6RS).
;   VS Code : PlatformIO > PROJECT TASKS > test_rs485 > Upload and Monitor
[env:test_rs485]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<test_rs485_simple.cpp>
build_src_flags = -Wall -Wextra


; Déplacement absolu simultané des moteurs du bus (adresses 1 et 2) en RS485 : taper le
; pas visé de chaque moteur dans le moniteur (ex. 5108 3000) ; les moteurs restent sous
; couple entre les mouvements, "off" les coupe :
; src/test_moteur_rs485.cpp, autonome (n'utilise pas lib/A6RS).
;   VS Code : PlatformIO > PROJECT TASKS > test_moteur > Upload and Monitor
[env:test_moteur]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
build_src_filter = -<*> +<test_moteur_rs485.cpp>
build_src_flags = -Wall -Wextra


; ---------------- Phases de test à 2 moteurs (adresses 1 et 2) ----------------
; Chaque phase est un programme autonome : PROJECT TASKS > test_xxx > Upload and Monitor.

; Phase 1 : deux déplacements différents qui arrivent ensemble (ex. 55 -15, en degrés)
[env:test_synchro]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
build_src_filter = -<*> +<test_synchro.cpp>
build_src_flags = -Wall -Wextra

; Phase 2 : mouvement articulaire trapézoïdal comme jointmotangles_trapezoidal
; (Coords/trajectoires4Axes.py), comparé au profil théorique
[env:test_articulaire]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
build_src_filter = -<*> +<test_articulaire.cpp>
build_src_flags = -Wall -Wextra

; Phase 3 : ligne droite (cartesian_trapezoidal_trajectory) découpée en 16 segments
; enchaînés par les variateurs
[env:test_lineaire]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
build_src_filter = -<*> +<test_lineaire.cpp>
build_src_flags = -Wall -Wextra

; Phase 4 : le PC (plus tard le Raspberry Pi) calcule les angles depuis X Y Z et les
; envoie au Teensy. Téléverser avec Upload (sans Monitor), puis lancer test_xyz.py.
[env:test_xyz]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
build_src_filter = -<*> +<test_xyz.cpp>
build_src_flags = -Wall -Wextra
