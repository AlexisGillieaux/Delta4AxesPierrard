; Configuration PlatformIO pour Teensy 4.1
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Vitesse de communication UART avec le Raspberry Pi (Serial1)
monitor_speed = 115200

; Le test des moteurs a son propre environnement (plus bas) : pas compilé ici
build_src_filter = +<*> -<test_moteur_rs485.cpp>

; Exemple de gestion des bibliothèques
; lib_deps =
;     bblanchon/ArduinoJson @ ^7.0.0


; Test d'un variateur A6-RS en RS485 (Modbus RTU) depuis le Teensy :
; src/test_moteur_rs485.cpp + bibliothèque lib/A6RS (aucune dépendance externe).
;   VS Code : PlatformIO > PROJECT TASKS > test_moteur > Upload and Monitor
;   Terminal : pio run -e test_moteur -t upload   puis   pio device monitor -e test_moteur
[env:test_moteur]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
build_src_filter = -<*> +<test_moteur_rs485.cpp>
build_src_flags = -Wall -Wextra
